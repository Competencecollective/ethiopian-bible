<style>
  :root {
    --cream:#f2e8d9; --cream-2:#e7dcc8; --card:#fffbf7; --card-2:#fcf6e5;
    --bronze:#ad803c; --bronze-deep:#8f682f; --bronze-soft:#c0a077;
    --tan:#cbbb9f; --ink-2:#342c23; --ink-3:#453b31; --brown:#78583f;
  }
  html, body { margin: 0; }
  body {
    min-height: 100svh; display: flex; align-items: flex-start; justify-content: center;
    color: var(--ink-2); background:
      radial-gradient(120% 90% at 50% -10%, #fffdf8 0%, var(--cream) 45%, var(--cream-2) 100%) var(--cream);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  main { width: 100%; max-width: 620px; margin: auto 0; }
  .card {
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--tan); border-radius: 20px; text-align: center;
    padding: 44px 34px 38px;
    box-shadow: 0 1px 0 #fff inset, 0 18px 38px -20px rgba(35,31,32,.38);
  }
  .eyebrow {
    font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
    color: var(--bronze-deep); margin: 0 0 18px;
  }
  .rule {
    height: 1px; width: min(280px, 72%); margin: 0 auto 26px;
    background: linear-gradient(90deg, transparent, var(--bronze-soft) 22%, var(--bronze) 50%, var(--bronze-soft) 78%, transparent);
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; color: var(--ink-3);
    font-size: clamp(30px, 6.6vw, 46px); line-height: 1.14; margin: 0 0 16px;
  }
  .sub { font-size: 16.5px; line-height: 1.6; color: var(--brown); margin: 0 auto 30px; max-width: 42ch; }
  a.go {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%; max-width: 280px; box-sizing: border-box;
    border-radius: 999px; padding: 17px 30px; font-size: 16px; font-weight: 700;
    text-decoration: none; color: #fffdf7;
    background: linear-gradient(180deg, var(--bronze-deep), #7d5a26);
    box-shadow: 0 10px 22px -10px rgba(143,104,47,.9), 0 1px 0 rgba(255,255,255,.28) inset;
  }
  a.go[aria-disabled="true"] { opacity: .55; }
</style>
</head>
<body>
<main>
  <div class="card">
    <p class="eyebrow">The Faith Made</p>
    <div class="rule"></div>
    <h1>The Ethiopian Bible</h1>
    <p class="sub">The complete Ethiopian canon. The books the Western Bible left out, bound in one volume. Emily texts you the page.</p>
    <a class="go" id="go" href="#" aria-disabled="true">Text me the page</a>
  </div>
</main>
<noscript><img height="1" width="1" style="display:none" alt=""
  src="https://www.facebook.com/tr?id=1566647111816717&ev=PageView&noscript=1"></noscript>
<script>
var go = document.getElementById('go');
var ready = false;
function arm(cfg) {
  if (!cfg || !cfg.enabled || !cfg.sms_number || !cfg.sms_body) return;
  var body = cfg.sms_body;
  if (body.toLowerCase().indexOf('send me the page') === -1) body += ' send me the page';
  go.href = 'sms:' + cfg.sms_number + '?&body=' + encodeURIComponent(body);
  go.removeAttribute('aria-disabled');
  ready = true;
}
function load() {
  return fetch('https://zobi.com/moneybag/sms/support/faithmade/config', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(arm);
}
load();
go.addEventListener('click', function (e) {
  if (!ready) {
    e.preventDefault();
    load().then(function () { if (ready) window.location.href = go.href; });
    return;
  }
  if (window.fbq) fbq('track', 'Lead');
});
</script>
</body>
</html>
