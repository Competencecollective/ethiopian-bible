<style>
  :root {
    --cream:#f2e8d9; --cream-2:#e7dcc8; --card:#fffbf7; --card-2:#fcf6e5;
    --bronze:#ad803c; --bronze-deep:#8f682f; --bronze-soft:#c0a077;
    --tan:#cbbb9f; --ink-2:#342c23; --ink-3:#453b31; --brown:#78583f;
  }
  html, body { margin: 0; }
  body {
    min-height: 100svh; display: flex; align-items: flex-start; justify-content: center;
    color: var(--ink-2); background:
      radial-gradient(120% 90% at 50% -10%, #fffdf8 0%, var(--cream) 45%, var(--cream-2) 100%) var(--cream);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  main { width: 100%; max-width: 620px; margin: auto 0; }
  .card {
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--tan); border-radius: 20px; text-align: center;
    padding: 44px 28px 32px;
    box-shadow: 0 1px 0 #fff inset, 0 18px 38px -20px rgba(35,31,32,.38);
  }
  .eyebrow {
    font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
    color: var(--bronze-deep); margin: 0 0 18px;
  }
  .rule {
    height: 1px; width: min(280px, 72%); margin: 0 auto 26px;
    background: linear-gradient(90deg, transparent, var(--bronze-soft) 22%, var(--bronze) 50%, var(--bronze-soft) 78%, transparent);
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; color: var(--ink-3);
    font-size: clamp(32px, 7vw, 48px); line-height: 1.08; margin: 0 0 14px;
  }
  .sub { font-size: 16.5px; line-height: 1.55; color: var(--brown); margin: 0 auto 22px; max-width: 36ch; }
  form { margin: 0 auto; max-width: 400px; text-align: left; }
  input[type=text], input[type=tel] {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 18px; font-weight: 600;
    text-align: center; color: var(--ink-3); padding: 16px; border-radius: 14px;
    background: #fffdf9; border: 1.5px solid var(--bronze); margin: 0 0 12px;
  }
  input:focus { outline: 3px solid var(--ink-3); outline-offset: 2px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: var(--brown); margin: 4px 0 16px; }
  .consent input { margin-top: 2px; accent-color: var(--bronze-deep); }
  button {
    width: 100%; border: 0; cursor: pointer; border-radius: 999px; padding: 17px 24px;
    font: inherit; font-size: 16px; font-weight: 700; color: #fffdf7;
    background: linear-gradient(180deg, var(--bronze-deep), #7d5a26);
    box-shadow: 0 10px 22px -10px rgba(143,104,47,.9), 0 1px 0 rgba(255,255,255,.28) inset;
  }
  button[disabled] { opacity: .6; cursor: default; }
  .err { min-height: 1.2em; margin: 10px 0 0; text-align: center; color: #a8452f; font-size: 14px; }
  .done { display: none; }
  .done h2 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; color: var(--ink-3);
    font-size: clamp(30px, 6vw, 42px); line-height: 1.12; margin: 0 0 12px;
  }
</style>

<body>
<main>
  <div class="card">
    <p class="eyebrow">The Faith Made</p>
    <div class="rule"></div>
    <div id="ask">
      <h1>The books they left out of the Bible.</h1>
      <p class="sub">A member of our team will personally reach out and text you the page. The complete Ethiopian canon. The books the Western Bible left out, in one volume.</p>
      <form id="form">
        <input type="text" id="name" name="name" autocomplete="given-name" placeholder="First name" maxlength="80" required>
        <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567" maxlength="24" required>
        <label class="consent"><input type="checkbox" id="consent"> A member of the team can text me about this. Reply STOP to end.</label>
        <button type="submit" id="go">Text me the page</button>
        <p class="err" id="err"></p>
      </form>
    </div>
    <div class="done" id="done">
      <h2>Watch your phone.</h2>
      <p class="sub">A member of our team is reaching out now.</p>
    </div>
  </div>
</main>
<noscript><img height="1" width="1" style="display:none" alt=""
  src="https://www.facebook.com/tr?id=1566647111816717&ev=PageView&noscript=1"></noscript>
<script>
var form = document.getElementById('form');
var err = document.getElementById('err');
var go = document.getElementById('go');
function digits(v){ return (v || '').replace(/\D/g, ''); }
form.addEventListener('submit', function (e) {
  e.preventDefault();
  err.textContent = '';
  var name = document.getElementById('name').value.trim();
  var raw = document.getElementById('phone').value.trim();
  var d = digits(raw);
  var phone = raw.charAt(0) === '+' ? '+' + d : d;
  var ok = raw.charAt(0) === '+' ? (d.length >= 8 && d.length <= 15) : d.length === 10;
  if (!name) { err.textContent = 'Please enter your name.'; return; }
  if (!ok) { err.textContent = 'That number does not look right.'; return; }
  if (!document.getElementById('consent').checked) { err.textContent = 'Check the box so we can text you.'; return; }
  go.disabled = true;
  go.textContent = 'Sending...';
  var params = new URLSearchParams(location.search);
  var utm = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term']
    .map(function (k) { return params.get(k) ? k + '=' + params.get(k) : ''; })
    .filter(Boolean).join('&');
  var doors = [
    'https://www.competencecollective.com/api/faithmade-lead',
    'https://house-agricultural-journals-jungle.trycloudflare.com/'
  ];
  function send(i) {
    if (i >= doors.length) {
      err.textContent = 'Connection hiccup. Try once more.';
      go.disabled = false;
      go.textContent = 'Text me the page';
      return;
    }
    fetch(doors[i], {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        name: name, phone: phone, consent: true,
        referrer: document.referrer || '', utm: utm
      })
    }).then(function (r) {
      return r.json().then(function (j) { return j; }, function () { return null; });
    }).then(function (j) {
      if (!j || typeof j.ok !== 'boolean') { send(i + 1); return; }
      if (j.ok) {
        if (window.fbq) fbq('track', 'Lead');
        document.getElementById('ask').style.display = 'none';
        document.getElementById('done').style.display = 'block';
        return;
      }
      err.textContent = j.error || 'That did not go through. Try once more.';
      go.disabled = false;
      go.textContent = 'Text me the page';
    }).catch(function () { send(i + 1); });
  }
  send(0);
});
</script>
</body>
</html>
